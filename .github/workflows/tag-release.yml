name: Tag release

on:
  workflow_dispatch:
    inputs:
      upload_to_store:
        description: Upload packages to an existing or new Store draft (leave submission unchecked)
        required: false
        type: boolean
        default: false
      submit_to_store:
        description: Submit packages for Microsoft Store certification and publication
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag the package version and start Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TO_STORE: ${{ inputs.upload_to_store }}
          SUBMIT_TO_STORE: ${{ inputs.submit_to_store }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -ne 'branch') { throw 'Run this workflow on the branch to release.' }
          $config = ./eng/Get-WorkflowConfig.ps1
          [xml] $manifest = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $config.PackageManifestPath) -Raw
          $packageVersion = [string] $manifest.Package.Identity.Version
          if ($packageVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.0$') { throw 'The package version must use MAJOR.MINOR.PATCH.0.' }
          $version = ./eng/Get-ReleaseVersion.ps1 -Tag "v$packageVersion"
          $tag = "v$($version.ToString(3))"

          $response = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check existing release tags.' }
          $existing = @($response | ConvertFrom-Json | Where-Object { $_.ref -ceq "refs/tags/$tag" })
          if ($existing.Count -gt 0) {
            "$tag already exists. No tag was changed and Release was not started." >> $env:GITHUB_STEP_SUMMARY
            return
          }

          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create '$tag'. Existing tags are never overwritten." }
          "Created $tag at $env:GITHUB_SHA." >> $env:GITHUB_STEP_SUMMARY

          gh workflow run release.yml --repo "$env:GITHUB_REPOSITORY" --ref "$tag" -f "upload_to_store=$env:UPLOAD_TO_STORE" -f "submit_to_store=$env:SUBMIT_TO_STORE"
          if ($LASTEXITCODE -ne 0) { throw "Created '$tag', but could not start Release. Run Release manually on '$tag' with upload_to_store=$env:UPLOAD_TO_STORE and submit_to_store=$env:SUBMIT_TO_STORE." }
          "Started Release with upload_to_store=$env:UPLOAD_TO_STORE and submit_to_store=$env:SUBMIT_TO_STORE." >> $env:GITHUB_STEP_SUMMARY
